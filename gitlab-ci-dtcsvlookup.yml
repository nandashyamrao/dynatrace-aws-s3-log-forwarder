include:
  - component: sfgitlab.opr.statefarm.org/sfcomponents/utilities/gitlab-oidc-aws-sts/template@1
    inputs:
      gitlab_oidc_role_arn: "arn:aws:iam::190731337505:role/gitlab-ci-s3-reader-role"
      oidc_expires_in: "900"
      aws_region: "us-east-1"

stages:
  - fetch

fetch-and-process-csv:
  stage: fetch
  image: registry.sfgitlab.opr.statefarm.org/registry/sfcommon/aws-cli:v2
  tags:
    - shared-aws

  variables:
    PROJECT_BUCKET_NAME: "sf-logpoc-test-dtcsvlookupdata"
    CSV_KEY: "orgdata.csv"
    AWS_REGION: "us-east-1"
    DT_SECRET_NAME: "dtcsvlookup"
    PE_COMPONENT_EVENTING_SKIP_PRE_BUILD: "true"

  script:
    - set -euo pipefail

    - export PE_COMPONENT_EVENTING_COMPONENT_DATA=""
    - export PE_COMPONENT_EVENTING_CA_CERT=""

    - !reference [.gitlab-oidc-aws-sts-credentials, script]

    - echo "==> Listing objects in s3://${PROJECT_BUCKET_NAME}/"
    - aws s3 ls "s3://${PROJECT_BUCKET_NAME}/"

    - echo "==> Downloading ${CSV_KEY} ..."
    - aws s3 cp "s3://${PROJECT_BUCKET_NAME}/${CSV_KEY}" "./${CSV_KEY}"

    - echo "==> Row count:"
    - wc -l "./${CSV_KEY}" || true

    - echo "==> Running process_csv.sh ..."
    - bash process_csv.sh "./${CSV_KEY}" servicenow.csv
    - test -s servicenow.csv

    - |
      echo "==> Step 4: Loading Dynatrace credentials..."
      SECRET_JSON="$(aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$DT_SECRET_NAME" --query 'SecretString' --output text)"

      export CLIENT_ID="$(echo "$SECRET_JSON" | jq -r '.client_id // ."client-id"')"
      export CLIENT_SECRET="$(echo "$SECRET_JSON" | jq -r '.client_secret // ."client-secret"')"
      export GRANT_TYPE="$(echo "$SECRET_JSON" | jq -r '.grant_type // ."grant-type"')"
      export RESOURCE="$(echo "$SECRET_JSON" | jq -r '.resource')"
      export DT_TOKEN_URL="$(echo "$SECRET_JSON" | jq -r '.dt_token_url // ."dt-token-url"')"
      export DT_UPLOAD_URL_PROD="$(echo "$SECRET_JSON" | jq -r '.dt_upload_url_prod // ."dt-upload-url-prod"')"
      export DT_UPLOAD_URL_TEST="$(echo "$SECRET_JSON" | jq -r '.dt_upload_url_test // ."dt-upload-url-test"')"

    - |
      echo "==> Requesting OAuth token..."
      ACCESS_TOKEN="$(curl -sS -X POST "$DT_TOKEN_URL" -d "client_id=${CLIENT_ID}" -d "client_secret=${CLIENT_SECRET}" -d "grant_type=${GRANT_TYPE}" -d "resource=${RESOURCE}" | jq -r '.access_token')"
      test -n "$ACCESS_TOKEN"

    - |
      cat > /tmp/request.json <<'EOF'
      {
        "displayName": "SF ServiceNow Team Map",
        "description": "ServiceNow team directory for enrichment",
        "lookupField": "solma_id",
        "filePath": "lookups/sn/costcenter",
        "parsePattern": "LD:solma_id, LD:ci_name, LD:area_name, LD:director_alias, LD:manager_alias, LD:product_name, LD:product_suite_name, LD:tier, LD:wg_name, LD:costing_code, LD:tech_owner_alias, LD:tech_owner_name",
        "overwrite": true
      }
      EOF

    - |
      echo "==> Upload TEST"
      curl -sS -X POST "$DT_UPLOAD_URL_TEST" -H "Authorization: Bearer $ACCESS_TOKEN" -F "content=@servicenow.csv" -F "request=@/tmp/request.json;type=application/json"

    - |
      echo "==> Upload PROD"
      curl -sS -X POST "$DT_UPLOAD_URL_PROD" -H "Authorization: Bearer $ACCESS_TOKEN" -F "content=@servicenow.csv" -F "request=@/tmp/request.json;type=application/json"

    - |
      echo "==> Building Splunk CSV"
      mkdir -p splunk
      awk -v OFS=',' '
      BEGIN { FS="," }
      NR==1 {
        for (i=1;i<=NF;i++){h=$i;gsub(/^"+|"+$/,"",h);h="z_"h;header[i]=h;$i=h} print; next
      }
      NR>1 {
        for (i=1;i<=NF;i++){
          v=$i;gsub(/^"+|"+$/,"",v)
          if (header[i]=="z_solma_id"||header[i]=="z_tier"){$i=v}
          else{gsub(/"/,"""",v);$i="""v"""}
        } print
      }' servicenow.csv > splunk/servicenow.csv

    - |
      NOW_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
      printf "%s
"         "dt-csvlookup-datapipeline summary"         "timestamp_utc: ${NOW_UTC}"         > summary.txt

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - "./${CSV_KEY}"
      - servicenow.csv
      - summary.txt
      - splunk/servicenow.csv

  after_script:
    - !reference [.gitlab-oidc-aws-sts-credentials, after_script]
